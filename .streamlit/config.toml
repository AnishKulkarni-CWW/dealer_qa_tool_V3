# THIS is the file Streamlit actually reads.
#
# Streamlit loads its config from `.streamlit/config.toml` relative to the
# working directory the app is launched from (or from
# `~/.streamlit/config.toml`). The copy at the repo root is NEVER read by
# Streamlit itself — it exists because omniqa.spec bundles it into the
# frozen desktop build — so before this file existed, the whole [theme]
# block was dead: Streamlit Community Cloud fell back to its stock
# palette and painted the selected radio dot, checked boxes and focus
# rings in its default red instead of the product blue.
#
# Keep this file and the root config.toml identical.

[server]
# Streamlit Community Cloud gives the container roughly 2.7 GB of RAM in
# total, so a 5 GB upload ceiling is not something the app could survive
# using. A real run here is ~40 MB (a 12 MB bulletin PDF, ten ~2 MB model
# zips and a 19 KB xlsx), so 1 GB is generous with plenty of headroom.
#
# Local desktop runs are unaffected: run_app.py passes
# `--server.maxUploadSize 5120` on the command line, and CLI flags take
# precedence over this file.
maxUploadSize = 1024
maxMessageSize = 1024

# Left ON for the public deployment. It was disabled locally for large
# multipart uploads, but this URL is public and XSRF protection is worth
# keeping. If the file uploader starts failing on Cloud, set this to false
# and redeploy — that is the one symptom it causes.
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
# primaryColor is the blue every primary action uses in modules/theme.py.
# It has to be repeated here because Streamlit paints its OWN controls
# (selected radio dot, checked checkbox, toggle track, slider, focus
# rings) from these tokens rather than from any stable CSS hook.
primaryColor = "#1C69D4"
# The page canvas. modules/theme.py paints it too, but setting it here
# means the colour is already correct on the very first frame, before the
# stylesheet has been parsed.
backgroundColor = "#F4F7FC"
# Input fields take their fill from secondaryBackgroundColor. Leaving it
# at a grey made every text box read as disabled on the white cards, so
# it is white here and the cards provide the contrast instead. The
# sidebar also uses this token, and modules/theme.py overrides it there
# with the navy gradient.
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1B2D"
